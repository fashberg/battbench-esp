; BattBench-ESP: Bluetooth bridge for SkyRC MC5000 / MC3000 chargers.
; Board: ESP32-S3-DevKitC-1, module WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM).

[env:esp32s3-n16r8]
; pinned: pioarduino core 6.1.19 fits this platform (see CLAUDE.md); its ESP-IDF 5.5 still brings cJSON
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/web/index.html
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
